<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 첫번째 아이디어 - Rainbow Edition</title>
    <meta name="description" content="나의 첫 번째 아이디어를 무지개빛으로 빛나게 표현합니다.">
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <div class="glow-sphere"></div>
        <div class="content-wrapper">
            <h1 id="main-title" class="rainbow-text">내 첫번째 아이디어</h1>
            <div class="rainbow-decoration"></div>
        </div>
        
        <!-- Adventure Ship & Ocean -->
        <div class="ocean">
            <div class="wave"></div>
            <div class="wave"></div>
            <div class="ship-container">
                <div class="ship"></div>
            </div>
        </div>
    </main>
    <script>
        function createPetal() {
            const petal = document.createElement('div');
            petal.classList.add('petal');
            
            // Randomize petal properties
            const size = Math.random() * 15 + 10;
            petal.style.width = `${size}px`;
            petal.style.height = `${size}px`;
            petal.style.left = `${Math.random() * 100}vw`;
            
            const duration = Math.random() * 5 + 5;
            petal.style.animationDuration = `${duration}s`;
            
            const delay = Math.random() * 5;
            petal.style.animationDelay = `${delay}s`;
            
            // Add subtle variety in color
            const colors = ['#ffb7c5', '#ffd1dc', '#ffc0cb', '#ffe4e1'];
            petal.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];

            document.body.appendChild(petal);

            // Remove petal after animation
            setTimeout(() => {
                petal.remove();
            }, (duration + delay) * 1000);
        }

        // Create petals periodically
        setInterval(createPetal, 300);

        // Initial burst
        for(let i = 0; i < 15; i++) {
            createPetal();
        }
    </script>
</body>
</html>
